name: FinResolve AI CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/api/requirements.txt
        pip install pytest pytest-asyncio hypothesis ruff httpx

    - name: Run Secret Scan
      run: |
        python scripts/scan_secrets.py --test-fixture
        python scripts/scan_secrets.py

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Run Deterministic Benchmark Verification
      run: |
        python -m services.reconciliation.evaluate --cases 100 --seed 42
