[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require database or services)
    adversarial: Adversarial tests (security and robustness)
    evaluation: Evaluation tests (metrics against ground truth)
    slow: Slow tests (excluded from default runs)
